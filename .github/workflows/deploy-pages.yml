name: Deploy SwissCraft STATS website
# Re-trigger deployment after Pages activation

on:
  push:
    branches: [main]
    paths:
      - 'team-web/**'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/export-public-stats.mjs'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.STATS_WIF_PROVIDER != '')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Obtain temporary read access
        if: vars.STATS_WIF_PROVIDER != ''
        id: stats-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STATS_WIF_PROVIDER }}
          create_credentials_file: false
      - name: Refresh public gameplay statistics
        if: vars.STATS_WIF_PROVIDER != ''
        env:
          STATS_FIRESTORE_ACCESS_TOKEN: ${{ steps.stats-auth.outputs.auth_token }}
        run: node scripts/export-public-stats.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./team-web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
