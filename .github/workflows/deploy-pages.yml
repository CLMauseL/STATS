name: Deploy SwissCraft STATS website
# Re-trigger deployment after Pages activation

on:
  push:
    branches: [main]
    paths:
      - 'team-web/**'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/export-public-stats.mjs'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain temporary read access

        id: stats-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/31135085718/locations/global/workloadIdentityPools/holzkopf-pages/providers/github-pages
          create_credentials_file: false
          service_account: holzkopf-pages-reader@holzkopf-stats-clmausel.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
      - name: Refresh public gameplay statistics

        env:
          STATS_FIRESTORE_ACCESS_TOKEN: ${{ steps.stats-auth.outputs.access_token }}
        run: node scripts/export-public-stats.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./team-web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4