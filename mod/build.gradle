plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
version = '0.5.0'
group = 'ch.clmausel'
base { archivesName = 'swisscraft-farming-tracker-26.2' }
repositories { mavenCentral(); maven { url 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.2'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }

tasks.register('accountingTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ch.clmausel.farmingtracker.AccountingTest'
}
check.dependsOn accountingTest
// Accounting checks are a standalone Java main, executed above without a test framework.
tasks.named('test', Test) { failOnNoDiscoveredTests = false }

tasks.register('pairingTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'ch.clmausel.farmingtracker.LocalPairingServerTest'
}
check.dependsOn pairingTest
